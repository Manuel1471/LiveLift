name: Compatibility

on:
  workflow_call:

jobs:
  live-view:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        live_view: ["== 1.2.0", "== 1.2.15"]
    env:
      LIVE_LIFT_LIVE_VIEW_VERSION: ${{ matrix.live_view }}
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          elixir-version: "1.18"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --prefix bench
      - run: rm mix.lock && mix deps.get
      - run: mix test
      - name: Compare parser outcomes on demo templates
        run: mix run bench/compare_template_parsers.exs demo examples/demo/lib
      - run: node --test assets/js/live_lift/client_hook.test.js
      - name: Install Phoenix generator
        run: mix archive.install hex phx_new 1.8.16 --force
      - name: Install browsers
        run: npx playwright install chromium firefox webkit --with-deps
        working-directory: bench
      - name: Verify the pinned LiveView in a fresh Phoenix app
        env:
          LIVE_LIFT_CONSUMER_BROWSER_PORT: '4047'
        run: sh test/integration/phoenix_consumer.sh
      - name: Verify manual integration with a custom LiveSocket
        if: matrix.live_view == '== 1.2.15'
        env:
          LIVE_LIFT_CONSUMER_BROWSER_PORT: '4047'
          LIVE_LIFT_INTEGRATION_MANUAL: '1'
        run: sh test/integration/phoenix_consumer.sh
