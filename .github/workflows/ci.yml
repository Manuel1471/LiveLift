name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - otp: '27'
            elixir: '1.18'
          - otp: '29'
            elixir: '1.20'
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          elixir-version: ${{ matrix.elixir }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: mix deps.get
      - run: mix format --check-formatted
      - run: npm ci
        working-directory: bench
      - run: mix test
      - run: npm test
        working-directory: assets
      - run: mix deps.get
        working-directory: examples/demo
      - run: mix format --check-formatted
        working-directory: examples/demo
      - run: mix test
        working-directory: examples/demo
      - run: mix assets.setup
        working-directory: examples/demo
      - run: mix assets.build
        working-directory: examples/demo

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '29'
          elixir-version: '1.20'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: mix deps.get
      - run: mix deps.get
        working-directory: examples/demo
      - run: mix assets.setup
        working-directory: examples/demo
      - run: npm ci
        working-directory: bench
      - run: npx playwright install chromium --with-deps
        working-directory: bench
      - run: npm run e2e
        working-directory: bench

  liveview-main:
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      LIVE_LIFT_LIVE_VIEW_VERSION: main
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '29'
          elixir-version: '1.20'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: mix deps.get
      - run: npm ci
        working-directory: bench
      - run: mix test
