name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - otp: '27'
            elixir: '1.18'
          - otp: '29'
            elixir: '1.20'
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          elixir-version: ${{ matrix.elixir }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: mix deps.get
      - run: mix format --check-formatted
      - run: npm ci
        working-directory: bench
      - run: mix test
      - run: mix test
        env:
          LIVE_LIFT_FORCE_TEMPLATE_FALLBACK: '1'
      - run: mix run spikes/liveview_api.exs
      - run: elixir bench/changeset_parity.exs
      - run: npm test
        working-directory: assets
      - run: mix deps.get
        working-directory: examples/demo
      - run: mix format --check-formatted
        working-directory: examples/demo
      - run: mix test
        working-directory: examples/demo
      - run: mix live_lift.test --cases test/live_lift_cases.json
        working-directory: examples/demo
      - run: mix assets.setup
        working-directory: examples/demo
      - run: mix assets.build
        working-directory: examples/demo
      - run: mix compile --force && mix test && mix assets.build
        working-directory: examples/demo
        env:
          LIVE_LIFT_FORCE_TEMPLATE_FALLBACK: '1'
      - run: npm run dom
        working-directory: bench
      - name: Verify the documented migration in a fresh Phoenix app
        if: matrix.otp == '29'
        run: |
          mix archive.install hex phx_new 1.8.16 --force
          sh test/integration/phoenix_consumer.sh

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '29'
          elixir-version: '1.20'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: mix deps.get
      - run: mix deps.get
        working-directory: examples/demo
      - run: mix assets.setup
        working-directory: examples/demo
      - run: npm ci
        working-directory: bench
      - run: npx playwright install chromium firefox webkit --with-deps
        working-directory: bench
      - run: npm run e2e
        working-directory: bench
      - run: npm run e2e -- e2e/island_loading.spec.mjs
        working-directory: bench
        env:
          LIVE_LIFT_TEST_DEPLOY: '1'

  liveview-main:
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      LIVE_LIFT_LIVE_VIEW_VERSION: main
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '29'
          elixir-version: '1.20'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: mix deps.get
      - run: npm ci
        working-directory: bench
      - run: mix test
      - run: mix run spikes/liveview_api.exs
