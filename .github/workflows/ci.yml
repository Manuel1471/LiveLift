name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - otp: '27'
            elixir: '1.18'
          - otp: '29'
            elixir: '1.20'
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          elixir-version: ${{ matrix.elixir }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: mix deps.get
      - run: mix format --check-formatted
      - run: npm ci
        working-directory: bench
      - run: mix test
      - run: mix test
        env:
          LIVE_LIFT_FORCE_TEMPLATE_FALLBACK: '1'
      - run: mix run spikes/liveview_api.exs
      - run: elixir bench/changeset_parity.exs
      - run: npm test
        working-directory: assets
      - run: mix deps.get
        working-directory: examples/demo
      - run: mix format --check-formatted
        working-directory: examples/demo
      - run: mix test
        working-directory: examples/demo
      - run: mix live_lift.test --cases test/live_lift_cases.json
        working-directory: examples/demo
      - run: mix assets.setup
        working-directory: examples/demo
      - name: Check the shared runtime size budget
        if: matrix.otp == '29'
        working-directory: examples/demo
        run: |
          esbuild=$(mix run --no-start --no-compile -e 'IO.write(Esbuild.bin_path())')
          python3 ../../bench/runtime_budget.py "$esbuild"
      - name: Verify development maps stay out of deployed assets
        run: sh ../../test/integration/demo_source_maps.sh
        working-directory: examples/demo
      - run: mix compile --force && mix test && mix assets.build
        working-directory: examples/demo
        env:
          LIVE_LIFT_FORCE_TEMPLATE_FALLBACK: '1'
      - run: npm run dom
        working-directory: bench
      - name: Verify the documented migration in a fresh Phoenix app
        if: matrix.otp == '29'
        run: |
          mix archive.install hex phx_new 1.8.16 --force
          sh test/integration/phoenix_consumer.sh
          LIVE_LIFT_INTEGRATION_IGNITER=1 sh test/integration/phoenix_consumer.sh

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '29'
          elixir-version: '1.20'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: mix deps.get
      - run: mix deps.get
        working-directory: examples/demo
      - run: mix assets.setup
        working-directory: examples/demo
      - run: npm ci
        working-directory: bench
      - run: npx playwright install chromium firefox webkit --with-deps
        working-directory: bench
      - run: npm run e2e
        working-directory: bench
      - run: >-
          npm run e2e -- e2e/island_loading.spec.mjs e2e/devtools.spec.mjs
          e2e/local_actions.spec.mjs e2e/content_security_policy.spec.mjs
          e2e/root_navigation.spec.mjs
        working-directory: bench
        env:
          LIVE_LIFT_TEST_DEPLOY: '1'
      - name: Verify reconnect, offline expiry and debounce with digested assets
        run: npm run e2e -- --grep 'connection cut|offline action expiry|phx-debounce delays|submit cancels'
        working-directory: bench
        env:
          LIVE_LIFT_TEST_DEPLOY: '1'

  compatibility:
    name: Compatibility
    uses: ./.github/workflows/compatibility.yml

  publish-hex:
    name: Publish to Hex
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, browser, compatibility]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    concurrency:
      group: publish-live-lift-hex
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '29'
          elixir-version: '1.20'
      - name: Check whether this version is available on Hex
        id: release
        run: |
          version=$(elixir -e 'Mix.start(); Mix.Project.in_project(:live_lift, ".", fn _ -> IO.puts(Mix.Project.config()[:version]) end)')
          status=$(curl --silent --show-error --retry 3 --max-time 20 \
            --output /dev/null --write-out '%{http_code}' \
            "https://hex.pm/api/packages/live_lift/releases/$version")
          case "$status" in
            200) echo "LiveLift $version is already available on Hex." ;;
            404)
              echo "publish=true" >> "$GITHUB_OUTPUT"
              echo "version=$version" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::Hex returned HTTP $status while checking LiveLift $version."
              exit 1
              ;;
          esac
      - name: Verify and summarize release notes
        if: steps.release.outputs.publish == 'true'
        run: elixir scripts/release_notes.exs check >> "$GITHUB_STEP_SUMMARY"
      - name: Build documentation
        if: steps.release.outputs.publish == 'true'
        run: |
          mix deps.get
          mix docs --warnings-as-errors
      - name: Stage package and documentation
        if: steps.release.outputs.publish == 'true'
        id: staged
        shell: bash
        env:
          NO_COLOR: '1'
          HEX_API_KEY: ${{ secrets.HEX_API_KEY_2 }}
        run: |
          if [ -z "$HEX_API_KEY" ]; then
            echo "::error::Set the HEX_API_KEY_2 repository secret to publish LiveLift."
            exit 1
          fi
          log="$RUNNER_TEMP/hex-publish.log"
          mix hex.publish --yes | tee "$log"
          checksum=$(sh scripts/hex_staged_checksum.sh "$log")
          echo "digest=sha256:$checksum" >> "$GITHUB_OUTPUT"
      - name: Attest the staged Hex package
        if: steps.release.outputs.publish == 'true'
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-name: live_lift-${{ steps.release.outputs.version }}.tar
          subject-digest: ${{ steps.staged.outputs.digest }}

  liveview-main:
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      LIVE_LIFT_LIVE_VIEW_VERSION: main
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '29'
          elixir-version: '1.20'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: mix deps.get
      - run: npm ci
        working-directory: bench
      - run: mix test
      - run: mix run spikes/liveview_api.exs
